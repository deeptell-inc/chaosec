[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scarcode"
version = "0.1.0"
description = "Information protection of quantum many-body scar vs thermal codes under monitored (measurement-induced) dynamics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Hikaru Wakaura", email = "h.wakaura@deeptell.jp" },
    { name = "Taiki Tanimae", email = "t.tanimae@deeptell.jp" },
]
keywords = [
    "quantum-information",
    "measurement-induced-phase-transition",
    "quantum-many-body-scars",
    "quantum-error-correction",
    "PXP-model",
    "coherent-information",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
dev = ["pytest>=7.0", "matplotlib>=3.4", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/hwakaura/scarcode"
Repository = "https://github.com/hwakaura/scarcode"
Issues = "https://github.com/hwakaura/scarcode/issues"

[project.scripts]
scarcode-demo = "scarcode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scarcode"]

[tool.hatch.build.targets.sdist]
include = [
    "/scarcode",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # benign FP-exception flags from some BLAS backends (e.g. Apple Accelerate)
    "ignore:.*encountered in matmul:RuntimeWarning",
]
